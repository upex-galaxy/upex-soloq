name: Jira Sync Smart
run-name: Jira Sync Smart • ${{ github.event_name }}

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      issue_key:
        description: Jira issue key (e.g., SQ-55). Empty = periodic mode
        required: false
        type: string
      issue_type:
        description: Optional hint from Jira (Story/Epic/Bug/...)
        required: false
        type: string
  repository_dispatch:
    types:
      - jira_issue_changed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jira-sync-smart
  cancel-in-progress: true

jobs:
  sync-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Prepare sync mode
        id: prep
        shell: bash
        run: |
          ISSUE_KEY=""
          ISSUE_TYPE=""

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            ISSUE_KEY='${{ github.event.client_payload.issue_key }}'
            ISSUE_TYPE='${{ github.event.client_payload.issue_type }}'
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_KEY='${{ github.event.inputs.issue_key }}'
            ISSUE_TYPE='${{ github.event.inputs.issue_type }}'
          fi

          ISSUE_TYPE_LOWER="$(printf '%s' "$ISSUE_TYPE" | tr '[:upper:]' '[:lower:]')"
          MODE="full"
          CMD="bun jira-sync pull --include-comments"

          if [ -n "$ISSUE_KEY" ]; then
            case "$ISSUE_TYPE_LOWER" in
              epic)
                MODE="epic"
                CMD="bun jira-sync pull --epic $ISSUE_KEY --include-comments"
                ;;
              story|bug|defect|improvement|test|task|sub-task|subtask)
                MODE="story"
                CMD="bun jira-sync pull --story $ISSUE_KEY --include-comments"
                ;;
              *)
                MODE="story"
                CMD="bun jira-sync pull --story $ISSUE_KEY --include-comments"
                ;;
            esac
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "issue_type=$ISSUE_TYPE" >> "$GITHUB_OUTPUT"
          echo "sync_command=$CMD" >> "$GITHUB_OUTPUT"

      - name: Validate Jira connection
        env:
          ATLASSIAN_URL: ${{ secrets.ATLASSIAN_URL != '' && secrets.ATLASSIAN_URL || secrets.JIRA_URL }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL != '' && secrets.ATLASSIAN_EMAIL || secrets.JIRA_USERNAME }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN != '' && secrets.ATLASSIAN_API_TOKEN || secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT: SQ
        run: bun jira-sync status

      - name: Sync Jira to context
        env:
          ATLASSIAN_URL: ${{ secrets.ATLASSIAN_URL != '' && secrets.ATLASSIAN_URL || secrets.JIRA_URL }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL != '' && secrets.ATLASSIAN_EMAIL || secrets.JIRA_USERNAME }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN != '' && secrets.ATLASSIAN_API_TOKEN || secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT: SQ
        run: ${{ steps.prep.outputs.sync_command }}

      - name: Create Pull Request with sync changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            .context/PBI/**
          commit-message: 'chore(jira-sync): sync Jira context files'
          branch: 'chore/jira-sync-auto-${{ github.run_id }}'
          base: staging
          delete-branch: true
          title: 'chore(jira-sync): automated Jira context sync'
          body: |
            Automated Jira sync PR generated by `jira-sync-smart` workflow.

            - Trigger: `${{ github.event_name }}`
            - Mode: `${{ steps.prep.outputs.mode }}`
            - Issue key: `${{ steps.prep.outputs.issue_key || 'N/A' }}`
            - Issue type: `${{ steps.prep.outputs.issue_type || 'N/A' }}`
            - Command: `${{ steps.prep.outputs.sync_command }}`

            Base branch follows repository rule: `staging`.
          labels: |
            automation
            jira-sync
